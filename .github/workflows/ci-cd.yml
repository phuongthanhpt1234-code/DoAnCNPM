name: HoiAn Food Guide - CI/CD Web & Mobile Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. KIỂM TRA CODE VÀ BUILD WEB
  quality-check:
    name: Lint, TypeScript & Web Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Expo Lint
        run: npx expo lint

      - name: Build Expo Web
        run: npx expo export --platform web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  # 2. DEPLOY WEB LÊN VERCEL
  deploy-web:
    name: Deploy Web to Vercel
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Vercel Secrets
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error::Missing GitHub Secret VERCEL_TOKEN"
            exit 1
          }
          test -n "$VERCEL_ORG_ID" || {
            echo "::error::Missing GitHub Secret VERCEL_ORG_ID"
            exit 1
          }
          test -n "$VERCEL_PROJECT_ID" || {
            echo "::error::Missing GitHub Secret VERCEL_PROJECT_ID"
            exit 1
          }

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel Project
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" \
            > .vercel/project.json

      - name: Deploy Web to Vercel
        shell: bash
        run: |
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  # 3. CẬP NHẬT ỨNG DỤNG MOBILE QUA EXPO EAS
  deploy-mobile-ota:
    name: Publish Expo EAS Update (Mobile)
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish Expo EAS Update
        if: ${{ secrets.EXPO_TOKEN != '' }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA Update
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: npx eas-cli@latest update --auto --non-interactive
