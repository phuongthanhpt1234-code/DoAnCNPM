name: HoiAn Food Guide - CI/CD Web & Mobile Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

jobs:
  # 1. KIỂM TRA CHẤT LƯỢNG CODE & BUILD THỬ WEB (CONTINUOUS INTEGRATION)
  quality-check:
    name: Lint, TypeScript & Web Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure ESLint is installed for Expo Lint
        run: npx expo install eslint eslint-config-expo

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Expo Lint
        run: npx expo lint

      - name: Verify Static Web Build (Expo Web)
        run: npx expo export --platform web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

  # 2. TRIỂN KHAI WEB LÊN VERCEL (CHẠY KHI ĐÃ CẤU HÌNH ĐỦ VERCEL SECRETS)
  deploy-web:
    name: Deploy Web to Vercel
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Download Web Build Artifact
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      - name: Deploy to Vercel Production via CLI
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          mkdir -p ./dist/.vercel
          echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > ./dist/.vercel/project.json
          npx vercel@latest deploy ./dist --prod --token="$VERCEL_TOKEN" --yes

  # 3. CẬP NHẬT ỨNG DỤNG DI ĐỘNG QUA OTA (CHẠY KHI ĐÃ CẤU HÌNH EXPO_TOKEN)
  deploy-mobile-ota:
    name: Publish Expo EAS Update (Mobile)
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        if: env.EXPO_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: env.EXPO_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo & EAS CLI
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: npm install --legacy-peer-deps

      - name: Publish Over-The-Air (OTA) Update
        if: env.EXPO_TOKEN != ''
        run: npx eas-cli@latest update --auto --non-interactive
