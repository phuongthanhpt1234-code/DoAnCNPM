name: HoiAn Food Guide - CI/CD Web & Mobile Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

jobs:
  # 1. KIỂM TRA CHẤT LƯỢNG CODE & BUILD THỬ WEB (CONTINUOUS INTEGRATION)
  quality-check:
    name: Lint, TypeScript & Web Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure ESLint is installed for Expo Lint
        run: npx expo install eslint eslint-config-expo

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Expo Lint
        run: npx expo lint

      - name: Verify Static Web Build (Expo Web)
        run: npx expo export --platform web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

  # 2. DEPLOY WEB TO VERCEL
  deploy-web:
    name: Deploy Web to Vercel
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Vercel Secrets
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_PROJECT_ID" && exit 1)

      - name: Link Vercel Project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" \
            > .vercel/project.json

      - name: Pull Vercel Configuration
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Production
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Production
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes

  # 3. CẬP NHẬT ỨNG DỤNG DI ĐỘNG QUA OTA (CHẠY KHI ĐÃ CẤU HÌNH EXPO_TOKEN)
  deploy-mobile-ota:
    name: Publish Expo EAS Update (Mobile)
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        if: env.EXPO_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: env.EXPO_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo & EAS CLI
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: npm install --legacy-peer-deps

      - name: Publish Over-The-Air (OTA) Update
        if: env.EXPO_TOKEN != ''
        run: npx eas-cli@latest update --auto --non-interactive
