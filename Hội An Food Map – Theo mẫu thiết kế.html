<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hội An Food Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
:root{--bg:#090505;--red:#d4152f;--gold:#e9c26b;--txt:#f5ead4;--mut:#a89a82;--line:rgba(233,194,107,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#2a0c0c,var(--bg) 55%);color:var(--txt);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:300}
button,input,select,a{font:inherit;color:inherit}
.sd{position:fixed;top:0;bottom:0;width:8vw;max-width:135px;background-size:cover;background-position:center;z-index:0;pointer-events:none}
.sd.l{left:0;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.sd.r{right:0;-webkit-mask-image:linear-gradient(270deg,#000 55%,transparent);mask-image:linear-gradient(270deg,#000 55%,transparent)}
@media(max-width:1100px){.sd{display:none}}
.w{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 24px 100px}
.serif,.logo,h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif}
nav{display:flex;align-items:center;gap:24px;height:88px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:4px;color:var(--gold);line-height:.9;cursor:pointer}
.logo b{font-size:80px;font-weight:600}.logo span{display:block;font-size:34px;font-weight:600}.logo small{display:block;font-size:24px;font-weight:500}
.links{display:flex;gap:44px;margin:0 auto}
.links button{background:none;border:0;color:var(--mut);font-size:19px;cursor:pointer;padding:10px 0;position:relative}
.links button.on{color:var(--red)}.links button.on:after{content:'';position:absolute;left:0;right:0;bottom:-14px;height:2px;background:var(--red)}
.lg{display:flex;align-items:center;gap:6px;font-size:15px}
.lg button{background:none;border:0;cursor:pointer;padding:4px 6px;opacity:.75}
.lg button.on{color:var(--red);opacity:1;border-bottom:2px solid var(--red)}
.mob{display:none;background:#0008;border:1px solid var(--line);border-radius:9px;padding:8px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--gold);flex:none}
.ib.big{width:54px;height:54px;border-color:var(--gold);background:#0008}
.hero{display:grid;grid-template-columns:1.05fr 1.3fr 1.05fr;gap:28px;align-items:center;margin:28px 0 24px}
.fr{position:relative;height:390px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#111}
.fr>img{width:100%;height:100%;object-fit:cover;display:block}
.mid{text-align:center}
.mid h1{margin:0;font-weight:600;font-size:clamp(34px,4.3vw,62px);line-height:1.08;background:linear-gradient(#fbe7ab,#d49d3c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #e9c26b55)}
.mid p{font-size:clamp(16px,1.7vw,21px);line-height:1.55;margin:18px 0 24px;color:#fff}
.bt{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.pill{border-radius:99px;padding:15px 26px;border:1px solid var(--line);background:#0006;cursor:pointer;font-size:16px}
.pill.red{background:linear-gradient(#e0182f,#a50f22);border-color:#ff6b6b66;box-shadow:0 6px 24px #d4152f55}
.mk{cursor:pointer}.live{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.live button{background:#cfc8bccc;color:#222;border:0;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px}
.mc{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:215px;background:#fffdf8;color:#2a1a1a;border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px #000a}
.mc .t{display:flex;gap:10px;align-items:center;font-size:15px}.mc .t small{color:#888;display:block}
.mc .ph{width:44px;height:44px;aspect-ratio:1;border-radius:10px;flex:none}
.mc .r{display:flex;justify-content:space-around;margin-top:8px;border-top:1px solid #0001;padding-top:8px}
.mc .ib{border:0;color:#444;width:34px;height:34px}
.fl{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 30px;padding-bottom:30px;border-bottom:1px solid var(--line)}
.sb{flex:1 1 320px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:99px;padding:0 22px;background:#0007;height:58px}
.sb input{flex:1;background:none;border:0;outline:0;font-size:17px;min-width:0}
.ch{border:1px solid var(--line);background:#0007;border-radius:99px;padding:0 24px;height:58px;cursor:pointer;font-size:17px}
.ch.on{background:#4a0d14;border-color:var(--red)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.sh h2{margin:0;font-weight:600;font-size:clamp(32px,4vw,44px);color:#f3dfae}.sub{color:var(--mut)}
.sh button{background:none;border:0;color:var(--gold);cursor:pointer;font-size:17px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.c{border:1px solid var(--line);border-radius:24px;padding:10px;background:linear-gradient(#1a0e0e,#0e0707)}
.ph{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;cursor:pointer}
.ph img,.ph svg{width:100%;height:100%;object-fit:cover;display:block}
.bg{position:absolute;left:12px;bottom:12px;background:#000b;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px}
.ci{padding:12px 10px 6px}.ci h3{margin:0;font-size:30px;font-weight:600;color:#f5e4b8}
.rw{display:flex;align-items:center;gap:8px;margin-top:12px}.rw .st{color:var(--gold)}.rw .sp{flex:1}
.fab{position:fixed;right:24px;bottom:24px;width:68px;height:68px;z-index:8;border-width:2px;box-shadow:0 8px 30px #000a;background:#1a0d0d}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:#150b0b;border:1px solid var(--gold);border-radius:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.md .ph{border-radius:0;aspect-ratio:16/9}.md .bd{padding:20px}.md h2{margin:0;color:var(--gold);font-size:32px}.md p{line-height:1.7}
.pl{display:flex;align-items:center;gap:10px;margin:12px 0}.pb{flex:1;height:6px;background:#3a1a1a;border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.btn{background:#0006;border:1px solid var(--gold);border-radius:99px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block}.btn.pri{background:var(--red);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
@media(max-width:1000px){.gr{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.links{display:none}.fr{height:280px}.logo{margin-right:auto}}
@media(max-width:760px){.lg{display:none}.mob{display:block}}
@media(max-width:620px){.gr{grid-template-columns:1fr}.logo b{font-size:60px}nav{gap:12px}}
.pulse{animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.3}}
</style></head><body>
